# The lake-rustfs module's manifest for quality-sdk (decision 0002): the lake
# on RustFS. Its version is the module's one version source: a release tag is
# `v` + this version, and tools/package.sh refuses any other.
name: lake-rustfs
version: 0.3.0

# The capability `lake` and the protocols it promises. The properties are
# what a consumer reads from the core, never assumes (core decision 0078,
# point 4, as its step 1 found them on RustFS 1.0.5).
provides:
  capabilities:
    - name: lake
      version: 1
      protocols: [s3, iceberg-rest, sts, mtls-gate, lake-admin/1]
      properties:
        credential-vending: unsupported
        drop-purge: unsupported
        catalog-prefix: from-config
        region: us-east-1
        url-style: path
        catalog-sigv4-service: s3
        sts-min-duration-secs: 900
        lake-admin-port: 9020

# The console's route, its sign-in and its menu entry stay in the core's
# apps.yml for now: the console runs on the lake's machines behind the gate,
# not beside the core's Traefik.

# The main lake and its replica each run RustFS, its gate and the adapter on
# their own machines, with their own keys: each role is the machine role a
# joined machine's certificate carries, and gets the images and files of the
# services it lists (quality-sdk decision 0013). Every machine of a lake is
# updated together, in a planned short stop (`all`). A lake may be one node,
# of one drive or of several (compose.yml, LAKE_DRIVES).
topology:
  roles:
    - name: lake
      services: [rustfs, gate, admin]
      strategy: all
    - name: lake-replica
      services: [rustfs, gate, admin]
      strategy: all

health:
  services: [rustfs, gate, admin]

# RustFS's data is the module's: kept on remove, deleted only by purge. It is
# critical, and an in-sync replica is its backup (`backup: replica`). The
# replica is optional: with one configured, an update of this module goes
# ahead only when the core says it is in sync and every node is healthy;
# with none, the agent backs the volume up with a checked copy first, as any
# critical volume (quality-sdk decision 0012). Every drive is under /data.
# The adapter keeps no data.
data:
  volumes:
    - name: rustfs-data
      service: rustfs
      path: /data
      critical: true
      backup: replica
